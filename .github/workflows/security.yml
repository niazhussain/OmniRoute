# .github/workflows/ci-security.yml — calls the shared security gate (niazhussain/pipeline-workflows).
# Secrets, malware, SAST, SCA, IaC, image and DAST scans; the gate blocks on new Critical/High
# findings and on a score under min-score. Protect main with a ruleset that requires this check.
name: security

on:
  pull_request:
  push:
    branches: [main]          # must be this repository's default branch, or no baseline is saved
  schedule:
    - cron: '0 3 * * 1'       # weekly: new CVEs against unchanged code; keeps the baseline fresh
  workflow_dispatch:
  # merge_group:              # uncomment if this repository uses a merge queue

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel a run that saves the baseline

jobs:
  security:
    # Full commit SHA of the gate release, never a branch or tag (a moved tag would change what runs).
    # Dependabot proposes newer releases as SHA bumps, using the tag in the trailing comment.
    uses: niazhussain/pipeline-workflows/.github/workflows/security.yml@943bfa8c8d1f10157d0f9f18485bfaf40468e178 #v2.1.1
    permissions:              # upper bound for the gate's jobs
      contents: read
      actions: read           # baseline download, CodeQL, Scorecard
      issues: read            # Scorecard on private repos
      pull-requests: read     # Scorecard on private repos
      checks: read            # Scorecard on private repos
      security-events: write  # CodeQL
    with:
      app-port: '3000'
      health-path: /healthz
      check-headers: true     # the app sends the browser security headers on every response
      max-critical: 0
      max-high: 0
      min-score: 80
    secrets:
      # Read-only token for the private gate repository, so the gate's zizmor step can read it.
      # Store it as both an Actions and a Dependabot secret named PIPELINE_WORKFLOWS_READ.
      pipeline-read-token: ${{ secrets.PIPELINE_WORKFLOWS_READ }}
